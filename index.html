<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leuchtfeuer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3D-Koop-Escape für zwei Handys: Bringt das Leuchtfeuer wieder zum Brennen, bevor der Frachter auf die Klippen läuft.">
<meta name="theme-color" content="#0a1018">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Source+Sans+3:wght@400;600&family=Courier+Prime&display=swap">
<style>
/* Layout: Vollbild-3D, darüber schmale Kopfzeile (Rolle, Uhr) und unten aufklappende Karten zum Untersuchen.
   Bewusst nur ein Look: Sturmnacht. Tiefblau-Schiefer, warmes Lampenlicht als Akzent, Signalrot für Gefahr. */
:root {
  --nacht: #0a1018;
  --flaeche: #121b26;
  --flaeche-2: #1a2633;
  --linie: #2a3a4c;
  --text: #e8eef2;
  --leise: #93a4b3;
  --lampe: #ffc46b;
  --lampe-text: #2a1a00;
  --gefahr: #ff5a4e;
  --gut: #7fdcab;
  --papier: #efe6d2;
  --tinte: #2b241b;
  --f-titel: "Fraunces", Georgia, serif;
  --f-text: "Source Sans 3", system-ui, -apple-system, sans-serif;
  --f-mono: "Courier Prime", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--nacht); color: var(--text); font: 16px/1.5 var(--f-text); overflow: hidden; -webkit-text-size-adjust: 100%; }
canvas#welt { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.knopf { font: 600 16px var(--f-text); border-radius: 10px; padding: 12px 16px; cursor: pointer; border: 1px solid var(--linie); background: var(--flaeche-2); color: var(--text); text-align: center; }
.knopf.haupt { background: var(--lampe); color: var(--lampe-text); border-color: var(--lampe); }
.knopf.klein { font-size: 13px; padding: 7px 10px; }
.knopf:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--lampe); outline-offset: 2px; }
h1, h2 { font-family: var(--f-titel); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(40px, 12vw, 64px); font-weight: 800; line-height: .95; letter-spacing: -0.01em; }
h2 { font-size: 24px; font-weight: 800; }
p { margin: 0; }
.leise { color: var(--leise); }
input.feld { font: 600 24px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; text-align: center; width: 100%; color: var(--text); background: var(--nacht); border: 1px solid var(--linie); border-radius: 10px; padding: 12px; }

/* Menüs */
.menue {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto;
  background: radial-gradient(120% 70% at 50% 0%, rgba(255, 196, 107, .14), transparent 60%), rgba(10, 16, 24, .9);
  padding: calc(env(safe-area-inset-top, 0px) + 36px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px));
}
.menue-innen { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
.untertitel { font-size: 18px; color: var(--leise); max-width: 36ch; }
.reihe { display: flex; gap: 10px; flex-wrap: wrap; }
.reihe > .knopf { flex: 1 1 150px; }
.codeanzeige { font: 700 clamp(48px, 16vw, 68px)/1 var(--f-mono); letter-spacing: .2em; text-align: center; color: var(--lampe); }
.rolle { text-align: left; display: grid; gap: 4px; padding: 16px; border-radius: 14px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); cursor: pointer; font: inherit; }
.rolle b { font: 800 22px var(--f-titel); }
.rolle span { color: var(--leise); font-size: 15px; }
.rolle:hover { border-color: var(--lampe); }
.meldung { font-size: 14px; min-height: 1.4em; }
.meldung.fehler { color: var(--gefahr); }
.leuchtturm { width: 56px; height: 86px; }

/* HUD */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 10;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(rgba(10, 16, 24, .85), rgba(10, 16, 24, 0));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud .wer { font: 800 18px var(--f-titel); }
.hud .wer small { font: 400 12px var(--f-mono); color: var(--leise); margin-left: 6px; }
.hud .leer { flex: 1; }
.uhr { font: 700 26px var(--f-mono); font-variant-numeric: tabular-nums; }
.uhr.knapp { color: var(--gefahr); }
.fortschritt { display: flex; gap: 4px; }
.fortschritt i { width: 18px; height: 4px; border-radius: 2px; background: var(--linie); }
.fortschritt i.an { background: var(--lampe); }
.tipp {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 9;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  font-size: 14px; color: var(--text); background: rgba(10, 16, 24, .72); border: 1px solid var(--linie);
  padding: 8px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  transition: opacity .6s;
}
.fadenkreuz { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255, 255, 255, .5); z-index: 8; pointer-events: none; }

/* Untersuchungs-Karte */
.blatt {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  max-height: 86%; overflow-y: auto;
  background: var(--flaeche); border-top: 1px solid var(--linie); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -20px 60px rgba(0, 0, 0, .5);
}
.blatt-innen { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.blatt-kopf { display: flex; align-items: center; gap: 10px; }
.blatt-kopf h2 { flex: 1; }
.papier { background: var(--papier); color: var(--tinte); border-radius: 6px; padding: 16px; font: 16px/1.55 var(--f-mono); box-shadow: inset 0 0 40px rgba(120, 90, 40, .18); }
.papier h3 { font: 700 15px var(--f-mono); margin: 0 0 8px; letter-spacing: .06em; text-transform: uppercase; }
.messing { background: linear-gradient(135deg, #b8893a, #e2c071 45%, #9c6f28); color: #2b1d05; border-radius: 8px; padding: 16px; display: grid; gap: 10px; box-shadow: inset 0 0 0 3px rgba(60, 40, 5, .35); }
.messing h3 { font: 800 16px var(--f-titel); margin: 0; letter-spacing: .04em; text-transform: uppercase; }
.plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; font: 700 14px var(--f-mono); }
.plan svg, .hebel svg { width: 44px; height: 44px; }
.hebelreihe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.hebel { display: grid; gap: 6px; justify-items: center; background: #1f1a14; border: 1px solid #3d3326; border-radius: 10px; padding: 10px 4px; color: var(--text); cursor: pointer; font: 700 14px var(--f-mono); }
.hebel .griff { width: 16px; height: 46px; border-radius: 8px; background: #4a4036; position: relative; }
.hebel .griff::after { content: ""; position: absolute; left: -6px; width: 28px; height: 18px; border-radius: 6px; background: #c9302c; top: 28px; transition: top .2s; }
.hebel.ein .griff::after { top: 0; background: var(--gut); }
.tastatur { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.taste { font: 700 22px var(--f-mono); padding: 12px 0; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche-2); color: var(--text); cursor: pointer; }
.anzeige { font: 700 30px var(--f-mono); letter-spacing: .3em; text-align: center; padding: 8px; border-radius: 10px; background: #05080c; border: 1px solid var(--linie); color: var(--lampe); }
.wackeln { animation: wackeln .4s; }
@keyframes wackeln { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.kompass { width: min(260px, 70vw); height: auto; display: block; margin: 0 auto; }
.dreh { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kennung { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.slot { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--linie); background: #05080c; cursor: pointer; }
.slot.an { background: var(--lampe); box-shadow: 0 0 14px rgba(255, 196, 107, .7); border-color: var(--lampe); }
.kennzeile { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.kennzeile i { aspect-ratio: 1; border-radius: 2px; background: #cbbf9f; }
.kennzeile i.an { background: var(--tinte); }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 7px 4px; border-bottom: 1px dashed #b9ab88; text-align: left; vertical-align: middle; font-size: 14px; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.funk { border: 1px dashed var(--lampe); border-radius: 12px; padding: 12px; text-align: center; background: rgba(255, 196, 107, .07); }
.funk .code { font: 700 34px var(--f-mono); letter-spacing: .25em; color: var(--lampe); }
.funk p { font-size: 14px; color: var(--leise); }
.status { font-size: 14px; }
.status.gut { color: var(--gut); }
.status.fehler { color: var(--gefahr); }
.strafe { position: fixed; left: 50%; top: 32%; transform: translateX(-50%); font: 700 42px var(--f-mono); color: var(--gefahr); pointer-events: none; opacity: 0; z-index: 30; }
.strafe.an { animation: strafe 1.1s ease-out; }
@keyframes strafe { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
.stat b { font-family: var(--f-mono); }
@media (prefers-reduced-motion: reduce) { .wackeln, .strafe.an { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="welt" aria-label="3D-Ansicht des Raums"></canvas>
<div class="fadenkreuz" id="fadenkreuz" hidden></div>
<header class="hud" id="hud" hidden>
  <div class="wer" id="wer"></div>
  <div class="fortschritt" id="fortschritt"><i></i><i></i><i></i></div>
  <span class="leer"></span>
  <button class="knopf klein" id="was" type="button">Was tun?</button>
  <button class="knopf klein" id="ton" type="button" aria-pressed="false">Ton: aus</button>
  <output class="uhr" id="uhr">15:00</output>
</header>
<div class="tipp" id="tipp" hidden>Wischen zum Umsehen · Tippen zum Untersuchen</div>
<section class="blatt" id="blatt" hidden aria-live="polite"><div class="blatt-innen" id="blatt-innen"></div></section>
<section class="menue" id="menue"><div class="menue-innen" id="menue-innen"></div></section>
<div class="strafe" id="strafe">−30 s</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function rest() {
    if (!z.startzeit) return DAUER;

  }
  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function strafe(sek) {

    klang("falsch");
    if (W.blitz !== undefined) W.blitz = 1;
  }

  // ================= Ton =================
  let ac = null, tonAn = false, regenQuelle = null;
  function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; } catch { return null; } }

  }

  // ================= 3D-Welt =================

      W.glasMat.emissive.setHex(z.strom ? (an ? 0xffc46b : 0x332211) : 0x000000);
      W.strahl.material.opacity = z.gewonnen ? (an ? 0.3 : 0.06) : 0;
      W.strahlGruppe.rotation.y = -(z.linse ? M.peilung : 0) * Math.PI / 180 + Math.PI / 2;
      W.linse.rotation.y = W.strahlGruppe.rotation.y;
      W.kurbel.rotation.x += z.gewonnen ? dt * 4 : 0;
    }
    W.renderer.render(W.scene, W.camera);
  }

  // ================= Untersuchen =================
  function schliesse() { $("blatt").hidden = true; }
  function blatt(titel, html, setup) {
    $("blatt-innen").innerHTML = `<div class="blatt-kopf"><h2>${titel}</h2><button class="knopf klein" id="zu" type="button">Schließen</button></div>${html}`;
    $("blatt").hidden = false;
    $("zu").onclick = schliesse;
    setup && setup($("blatt-innen"));
  }
  function funkBox(code, text) { return `<div class="funk"><p>Durchs Sprachrohr nach ${z.rolle === "laterne" ? "unten" : "oben"}:</p><div class="code">${esc(code)}</div><p>${text}</p></div>`; }
  function setzeFortschritt() {
    const f = [z.strom, z.linse, z.gewonnen];
    [...$("fortschritt").children].forEach((el, i) => el.classList.toggle("an", !!f[i]));
  }
  function erfolg(neu) { Object.assign(z, neu); sichere(); setzeFortschritt(); klang("gut"); }

  function ziffernblock(el, laenge, pruefe) {
    let w = "";
    el.insertAdjacentHTML("beforeend", `<div class="anzeige" id="anz">${"·".repeat(laenge)}</div><div class="tastatur">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button class="taste" data-d="${d}">${d}</button>`).join("")}<button class="taste" data-d="x">⌫</button><button class="taste" data-d="0">0</button><button class="taste" data-d="ok">OK</button></div>`);
    const anz = el.querySelector("#anz");
    el.querySelector(".tastatur").onclick = (e) => {
      const d = e.target.closest("button")?.dataset.d; if (!d) return;
      if (d === "x") w = w.slice(0, -1);
      else if (d === "ok") { if (w.length === laenge && !pruefe(w)) { anz.classList.remove("wackeln"); void anz.offsetWidth; anz.classList.add("wackeln"); w = ""; } }
      else if (w.length < laenge) w += d;
      anz.textContent = w.padEnd(laenge, "·");
    };
  }

  const OEFFNEN = {
    // ----- Laterne -----
    logbuch() {
      blatt("Logbuch", `<div class="papier"><h3>Feuer Möwensand · Wärterlogbuch</h3>
        <p>14. Nov. Sturm aus NW. Generator im Keller zweimal ausgefallen. Wenn er steht, bekommt die Laterne keinen Strom, egal was man oben tut.</p><br>
        <p>Ablauf bei Ausfall:<br>1. Keller: Sicherungen nach dem Plan an der Messingplatte stellen, Generator anwerfen.<br>2. Oben: Freigabecode vom Keller an der Kontrolltafel eingeben.<br>3. Linse auf das Schiff richten. Die Peilung kommt per Telegraf in den Keller.<br>4. Kennung einstellen. Jedes Feuer hat seine eigene. Die Feuer-Nr. steht am Linsenfuß, das Verzeichnis ist unten im Regal.</p><br>
        <p>Und um Himmels willen: Sprachrohr benutzen.</p></div>`);
    },
    platte() {
      blatt("Messingplatte", `<div class="messing"><h3>Sicherungsplan · Generator</h3><div class="plan">${M.plan.map((ein, i) => `<div>${symbolSvg(i, "#3a2706")}<div>${SYMBOLE[i]}</div><div>${ein ? "EIN" : "AUS"}</div></div>`).join("")}</div></div><p class="leise">Der Sicherungskasten ist unten im Keller.</p>`);
    },
    tafel() {
      if (z.strom) return blatt("Kontrolltafel", `<p class="status gut">Strom liegt an. Die Laterne glimmt.</p>`);
      blatt("Kontrolltafel", `<p class="leise">Eine Lampe glimmt rot: <b>Kein Strom.</b> Darunter ein Ziffernfeld: „Freigabecode Generator“.</p>`, (el) => {
        ziffernblock(el, 3, (w) => {
          if (w === M.strom) { erfolg({ strom: true }); blatt("Kontrolltafel", `<p class="status gut">Klack. Die Lampe springt auf Grün, die Laterne glimmt warm.</p><p class="leise">Jetzt die Linse ausrichten.</p>`); return true; }
          strafe(30); return false;
        });
      });
    },
    linse() {
      let wert = z.linse ? M.peilung : 0;
      const kompass = () => `<svg class="kompass" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#0b1219" stroke="#b08a3e" stroke-width="4"/>${Array.from({ length: 36 }, (_, i) => { const a = i * 10 * Math.PI / 180, l = i % 9 === 0 ? 14 : 7; return `<line x1="${100 + Math.sin(a) * 90}" y1="${100 - Math.cos(a) * 90}" x2="${100 + Math.sin(a) * (90 - l)}" y2="${100 - Math.cos(a) * (90 - l)}" stroke="#b08a3e" stroke-width="2"/>`; }).join("")}${["N", "O", "S", "W"].map((b, i) => `<text x="${100 + Math.sin(i * Math.PI / 2) * 64}" y="${106 - Math.cos(i * Math.PI / 2) * 64}" fill="#e8eef2" font-size="16" font-family="Georgia" text-anchor="middle">${b}</text>`).join("")}<line id="nadel" x1="100" y1="100" x2="100" y2="22" stroke="#ffc46b" stroke-width="5" stroke-linecap="round" transform="rotate(${wert} 100 100)"/><circle cx="100" cy="100" r="7" fill="#ffc46b"/></svg>`;
      blatt("Linse", `<p class="leise">Am Fuß eingraviert: <b class="mono" style="font-family:var(--f-mono);color:var(--text)">Feuer-Nr. ${M.feuerNr}</b></p>
        ${kompass()}<div class="anzeige" id="grad">${String(wert).padStart(3, "0")}°</div>
        <div class="dreh"><button class="knopf" data-s="-10">−10</button><button class="knopf" data-s="-1">−1</button><button class="knopf" data-s="1">+1</button><button class="knopf" data-s="10">+10</button></div>
        <button class="knopf haupt" id="einrasten">${z.linse ? "Eingerastet" : "Einrasten"}</button><p class="status" id="ls" role="status"></p>`, (el) => {
        const male = () => { el.querySelector("#grad").textContent = String(wert).padStart(3, "0") + "°"; el.querySelector("#nadel").setAttribute("transform", `rotate(${wert} 100 100)`); };
        el.querySelector(".dreh").onclick = (e) => { const s = +e.target.closest("button")?.dataset.s; if (!s || z.linse) return; wert = (wert + s + 360) % 360; klang("klick"); male(); };
        el.querySelector("#einrasten").onclick = () => {
          const st = el.querySelector("#ls");
          if (z.linse) return;
          if (!z.strom) { st.textContent = "Ohne Strom bewegt sich der Linsenmotor nicht."; st.className = "status fehler"; return; }
          if (wert === M.peilung) { erfolg({ linse: true }); st.textContent = "Die Linse rastet ein. Sie zeigt genau auf die Lichter da draußen."; st.className = "status gut"; el.querySelector("#einrasten").textContent = "Eingerastet"; }
          else { strafe(30); st.textContent = "Daneben. Der Motor ruckelt zurück."; st.className = "status fehler"; }
        };
      });
    },
    kennung() {
      if (z.gewonnen) return zeigeSieg();
      const m = Array(8).fill(false);
      blatt("Kennungsgeber", `<p class="leise">Acht Takte, ein Umlauf. Tippe die Takte an, in denen das Feuer leuchten soll. Jedes Feuer hat seine eigene Kennung.</p>
        <div class="kennung" id="kn">${m.map((_, i) => `<button class="slot" data-i="${i}" aria-label="Takt ${i + 1}"></button>`).join("")}</div>
        <button class="knopf haupt" id="ueb">Kennung übernehmen</button><p class="status" id="ks" role="status"></p>`, (el) => {
        el.querySelector("#kn").onclick = (e) => { const b = e.target.closest(".slot"); if (!b) return; const i = +b.dataset.i; m[i] = !m[i]; b.classList.toggle("an", m[i]); klang("klick"); };
        el.querySelector("#ueb").onclick = () => {
          const st = el.querySelector("#ks");
          if (!z.strom || !z.linse) { st.textContent = !z.strom ? "Kein Strom." : "Erst die Linse ausrichten."; st.className = "status fehler"; return; }
          if (m.every((v, i) => v === M.muster[i])) { erfolg({ gewonnen: true, ende: Date.now() }); klang("horn"); setTimeout(zeigeSieg, 400); }
          else { strafe(30); st.textContent = "Falsche Kennung. Das Schiff würde uns für ein anderes Feuer halten."; st.className = "status fehler"; }
        };
      });
    },
    // ----- Keller -----
    brief() {
      blatt("Brief auf der Werkbank", `<div class="papier"><h3>An den neuen Gehilfen</h3>
        <p>Wenn der Generator steht: Die Sicherungen müssen genau so stehen wie auf der Messingplatte oben im Laternenraum. Ich hab mir das nie gemerkt, frag den da oben.</p><br>
        <p>Die Peilung zum Schiff kommt über den Telegrafen. Das Leuchtfeuerverzeichnis steht im Regal. Unsere Feuer-Nr. ist mir entfallen, aber sie steht oben am Linsenfuß.</p><br>
        <p>– Hinrich, Wärter</p></div>`);
    },
    sicherung() {
      if (z.generator) return blatt("Sicherungskasten", `<p class="status gut">Der Generator läuft. Der Boden vibriert.</p>${funkBox(M.strom, "Freigabecode für die Kontrolltafel oben.")}`);
      const s = z.hebel || [false, false, false, false];
      blatt("Sicherungskasten", `<p class="leise">Vier Hebel mit eingestanzten Symbolen. Oben grün = EIN, unten rot = AUS.</p>
        <div class="hebelreihe">${SYMBOLE.map((n, i) => `<button class="hebel${s[i] ? " ein" : ""}" data-i="${i}" aria-pressed="${s[i]}">${symbolSvg(i, "#e8eef2")}<span class="griff"></span><span>${n}</span></button>`).join("")}</div>
        <button class="knopf haupt" id="anwerfen">Generator anwerfen</button><p class="status" id="gs" role="status"></p>`, (el) => {
        el.querySelector(".hebelreihe").onclick = (e) => { const b = e.target.closest(".hebel"); if (!b) return; const i = +b.dataset.i; s[i] = !s[i]; z.hebel = s; sichere(); b.classList.toggle("ein", s[i]); b.setAttribute("aria-pressed", s[i]); klang("klick"); };
        el.querySelector("#anwerfen").onclick = () => {
          if (s.every((v, i) => v === M.plan[i])) { erfolg({ generator: true }); klang("generator"); OEFFNEN.sicherung(); }
          else { strafe(30); const st = el.querySelector("#gs"); st.textContent = "Funken sprühen. Der Generator stottert und bleibt stehen."; st.className = "status fehler"; }
        };
      });
    },
    telegraf() {
      blatt("Telegraf", `<div class="papier"><h3>Lochstreifen, eben eingegangen</h3>
        <p>+++ DAMPFER ELISE AN FEUER MOEWENSAND +++ KEIN LICHT SICHTBAR +++ UNSERE PEILUNG VON IHNEN AUS ${M.peilung} GRAD +++ BITTE FEUER ZEIGEN +++</p></div>
        <p class="leise">Unten am Gerät: „Antwort senden“. Drei Buchstaben, die Bestätigung von oben.</p>
        <form id="tf" class="stapel"><input class="feld" maxlength="3" autocomplete="off" autocapitalize="characters" aria-label="Bestätigung"><button class="knopf haupt" style="margin-top:8px">Senden</button><p class="status" id="ts" role="status"></p></form>`, (el) => {
        el.querySelector("#tf").onsubmit = (e) => {
          e.preventDefault();
          const w = el.querySelector("input").value.trim().toUpperCase();
          if (w === M.abschluss) { erfolg({ gewonnen: true, ende: Date.now() }); klang("horn"); zeigeSieg(); }
          else { const st = el.querySelector("#ts"); st.textContent = "Keine Antwort. Lass dir den Code von oben noch einmal geben."; st.className = "status fehler"; klang("falsch"); }
        };
      });
    },
    regal() {
      blatt("Leuchtfeuerverzeichnis", `<div class="papier"><h3>Verzeichnis der Leuchtfeuer · Nordsee</h3>
        <p style="font-size:13px">Kennung: acht Takte je Umlauf. Schwarz = Feuer an.</p><br>
        <table><thead><tr><th>Feuer-Nr.</th><th>Lage</th><th>Kennung</th></tr></thead><tbody>${
          M.eintraege.map((e) => `<tr><td><b>${e.nr}</b></td><td style="font-size:12px">${e.lage}</td><td><div class="kennzeile">${e.m.map((a) => `<i class="${a ? "an" : ""}"></i>`).join("")}</div></td></tr>`).join("")
        }</tbody></table></div>`);
    },
  };
  function oeffne(id) { (OEFFNEN[id] || (() => {}))(); }

  function zeigeSieg() {
    const s = rest();
    const sterne = s > 7 * 60 && (z.fehler || 0) <= 1 ? "★★★" : s > 3 * 60 ? "★★☆" : "★☆☆";
    const oben = z.rolle === "laterne";
    blatt("Das Feuer brennt", `<p>${oben ? "Der Strahl schneidet durch den Regen. Draußen dreht die Elise ab, langsam, schwerfällig, aber sie dreht ab." : "Durch den Telegrafen rattert eine Nachricht: +++ FEUER IN SICHT +++ DREHEN AB +++ DANKE MOEWENSAND +++"}</p>
      ${oben ? funkBox(M.abschluss, "Bestätigung für den Telegrafen unten.") : ""}
      <div class="stat"><span>Restzeit</span><b>${mmss(s)}</b><span>Fehler</span><b>${z.fehler || 0}</b><span>Bewertung</span><b>${sterne}</b></div>
      <button class="knopf haupt" id="neu">Neuer Einsatz</button>`, (el) => {
      el.querySelector("#neu").onclick = () => { z = { schritt: "start" }; sichere(); location.reload(); };
    });
  }

  function wasTun() {
    const oben = z.rolle === "laterne";
    let t;
    if (z.gewonnen) t = "Geschafft. Das Feuer brennt.";
    else if (!z.strom) t = oben ? "Kein Strom. Lies dem Keller den Sicherungsplan von der Messingplatte vor. Dann wartest du auf den Freigabecode." : "Frag oben nach dem Sicherungsplan, stell die Hebel und wirf den Generator an. Den Code gibst du nach oben.";
    else if (!z.linse) t = oben ? "Lass dir die Peilung zum Schiff geben und richte die Linse aus." : "Lies die Peilung vom Telegrafen nach oben.";
    else t = oben ? "Nenn dem Keller die Feuer-Nr. vom Linsenfuß. Er sagt dir die Kennung aus dem Verzeichnis." : "Frag oben nach der Feuer-Nr. und sag die Kennung aus dem Verzeichnis durch.";
    if (!oben && z.generator && !z.strom) t = "Gib oben den Freigabecode vom Sicherungskasten durch. Dann: Peilung vom Telegrafen.";
    blatt("Was tun?", `<p>${t}</p><p class="leise">Auf den leuchtenden Punkten kannst du etwas untersuchen.</p>`);
  }

  // ================= Menüs =================
  function menue(html, setup) { $("menue").hidden = false; $("menue-innen").innerHTML = html; setup && setup(); }
  function zeige() {
    if (z.schritt === "spiel" || z.schritt === "verloren") return spiel();
    const turm = `<svg class="leuchtturm" viewBox="0 0 56 86" aria-hidden="true"><path d="M18 84 22 30h12l4 54z" fill="#e8eef2"/><path d="M19.5 66h17l1 8h-19zM21 46h14l.8 8H20.2z" fill="#c9302c"/><rect x="20" y="18" width="16" height="12" fill="#ffc46b"/><path d="M17 18h22l-11-9z" fill="#c9302c"/><path d="M36 22 56 14v16z" fill="#ffc46b" opacity=".45"/></svg>`;
    ({
      start: () => menue(`${turm}<h1>Leucht&shy;feuer</h1><p class="untertitel">Sturmnacht auf Hallig Möwensand. Das Feuer ist aus, ein Frachter hält auf die Klippen zu. Zwei Handys, zwei Räume, ein Sprachrohr.</p>
        <p class="leise">Einer steht oben in der Laterne, einer unten im Maschinenraum. Ihr seht verschiedene Dinge und müsst reden, am selben Tisch oder per Telefon. 15 Minuten.</p>
        <div class="reihe"><button class="knopf haupt" id="neu">Einsatz planen</button><button class="knopf" id="bei">Einsatz beitreten</button></div>`, () => {
        $("neu").onclick = () => { z = { schritt: "code", code: neuerEinsatz() }; M = generiere(z.code); sichere(); zeige(); };
        $("bei").onclick = () => { z.schritt = "beitreten"; sichere(); zeige(); };
      }),
      code: () => menue(`<h2>Euer Einsatzcode</h2><div class="codeanzeige">${esc(z.code)}</div><p class="leise">Nenn ihn deinem Partner. Er tippt „Einsatz beitreten“.</p><button class="knopf haupt" id="w">Weiter</button><button class="knopf" id="z">Zurück</button>`, () => {
        $("w").onclick = () => { z.schritt = "rolle"; sichere(); zeige(); };
        $("z").onclick = () => { z = { schritt: "start" }; sichere(); zeige(); };
      }),
      beitreten: () => menue(`<h2>Einsatz beitreten</h2><form id="f" style="display:grid;gap:10px"><input class="feld" id="c" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Einsatzcode"><button class="knopf haupt">Beitreten</button><p class="meldung" id="m" role="status"></p></form><button class="knopf" id="z">Zurück</button>`, () => {
        $("f").onsubmit = (e) => { e.preventDefault(); const c = $("c").value.trim().toUpperCase(); if (!/^[A-Z2-9]{4}$/.test(c)) { $("m").textContent = "Der Code hat vier Zeichen."; $("m").className = "meldung fehler"; return; } z = { schritt: "rolle", code: c }; M = generiere(c); sichere(); zeige(); };
        $("z").onclick = () => { z = { schritt: "start" }; sichere(); zeige(); };
      }),
      rolle: () => menue(`<h2>Wo bist du?</h2><p class="leise">Einsatz <b>${esc(z.code)}</b>. Jeder nimmt einen anderen Raum.</p>
        <button class="rolle" data-r="laterne"><b>Laternenraum</b><span>Ganz oben, rundum Glas. Linse, Kontrolltafel, Kennungsgeber. Draußen der Sturm und das Schiff.</span></button>
        <button class="rolle" data-r="keller"><b>Maschinenraum</b><span>Ganz unten. Generator, Sicherungskasten, Telegraf und das Bücherregal.</span></button>
        <button class="knopf" id="z">Anderer Einsatz</button>`, () => {
        document.querySelectorAll(".rolle").forEach((b) => (b.onclick = () => { z.rolle = b.dataset.r; z.schritt = "bereit"; sichere(); zeige(); }));
        $("z").onclick = () => { z = { schritt: "start" }; sichere(); zeige(); };
      }),
      bereit: () => menue(`<h2>${z.rolle === "laterne" ? "Laternenraum" : "Maschinenraum"}</h2><p>${z.rolle === "laterne" ? "Du stehst oben in der Laterne. Durch die Scheiben siehst du die Lichter eines Schiffs. Die Laterne ist dunkel." : "Du stehst im Maschinenraum. Der Generator schweigt. Über dir heult der Sturm."}</p>
        <p class="leise">Wischen zum Umsehen, auf leuchtende Punkte tippen zum Untersuchen. Zählt gemeinsam herunter und tippt gleichzeitig auf „Los“.</p>
        <label class="reihe" style="align-items:center;gap:8px"><input type="checkbox" id="tonwahl" checked style="width:20px;height:20px"> Mit Ton (Sturm, Donner)</label>
        <button class="knopf haupt" id="los">Los</button><button class="knopf" id="z">Raum wechseln</button>`, () => {
        $("los").onclick = () => { tonAn = $("tonwahl").checked; Object.assign(z, { schritt: "spiel", startzeit: Date.now(), strafe: 0, fehler: 0, ende: null, strom: false, generator: false, linse: false, gewonnen: false, hebel: null, ton: tonAn }); sichere(); spiel(); };
        $("z").onclick = () => { z.schritt = "rolle"; sichere(); zeige(); };
      }),
    }[z.schritt] || (() => { z = { schritt: "start" }; zeige(); }))();
  }

  function spiel() {
    $("menue").hidden = true; $("hud").hidden = false; $("fadenkreuz").hidden = false; $("tipp").hidden = false;
    $("wer").innerHTML = `${z.rolle === "laterne" ? "Laterne" : "Keller"}<small>${esc(z.code)}</small>`;
    tonAn = !!z.ton; $("ton").textContent = tonAn ? "Ton: an" : "Ton: aus"; $("ton").setAttribute("aria-pressed", tonAn);
    if (typeof THREE === "undefined") { menue(`<h2>3D konnte nicht laden</h2><p class="leise">Die 3D-Bibliothek wurde blockiert. Prüfe die Internetverbindung und lade neu.</p>`); return; }
    if (!W.bereit) { try { baueWelt(); } catch (e) { menue(`<h2>3D wird nicht unterstützt</h2><p class="leise">Dieses Gerät oder dieser Browser kann kein WebGL. ${esc(e.message)}</p>`); return; } }
    setzeFortschritt();
    if (tonAn) regenStart();
    if (z.gewonnen) setTimeout(zeigeSieg, 300);
  }
  $("was").onclick = wasTun;
  $("ton").onclick = () => { tonAn = !tonAn; z.ton = tonAn; sichere(); $("ton").textContent = tonAn ? "Ton: an" : "Ton: aus"; $("ton").setAttribute("aria-pressed", tonAn); tonAn ? regenStart() : regenStopp(); };

  setInterval(() => {
    if (z.schritt !== "spiel") return;
    const s = rest(); $("uhr").textContent = mmss(s); $("uhr").classList.toggle("knapp", s < 120);
    if (s === 0 && !z.gewonnen && !z.verloren) {
      z.verloren = true; sichere(); klang("horn");
      blatt("Zu spät", `<p>Ein langes, tiefes Horn. Dann ein Knirschen, das man bis ${z.rolle === "laterne" ? "hier oben" : "in den Keller"} hört. Die Elise sitzt auf den Klippen.</p><p class="leise">Mit demselben Code bekommt ihr dieselben Rätsel.</p><div class="reihe"><button class="knopf haupt" id="nochmal">Gleicher Einsatz</button><button class="knopf" id="neu">Neuer Einsatz</button></div>`, (el) => {
        el.querySelector("#nochmal").onclick = () => { Object.assign(z, { schritt: "bereit", verloren: false }); sichere(); location.reload(); };
        el.querySelector("#neu").onclick = () => { z = { schritt: "start" }; sichere(); location.reload(); };
      });
    }
  }, 250);

  window.__lf = { generiere, oeffne, W, zustand: () => z };
  zeige();
})();
</script>
</body>
</html>
